services:
  - type: web
    name: parul-student-dossier-portal
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn student_app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: SELENIUM_CACHE_DIR
        value: /tmp/.selenium
